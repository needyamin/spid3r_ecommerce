# Spid3rWeb project runtime defaults (Spid3r v1.1.1+)
# Declares the project root as a module search path so `spid3r run tests/...`
# and `spid3r check ...` resolve `framework/*`, `config/*`, and `routes/*`
# without manually setting SPID3R_PATH.
# See `spid3r.ini.example` for production server guardrails.

[spid3r]
engine = vm

[modules]
path = .
